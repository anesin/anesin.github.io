name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ─────────────────────────────────────────────────────────────
      # ① 배포본 feed.xml에서 포스트 URL 추출(간결 버전) → url_list.txt 생성
      #    - 기본 도구만 사용: curl + grep + sed
      #    - 필요 시 중복 제거/상위 N개 제한 가능
      # ─────────────────────────────────────────────────────────────
      - name: Build URL list from feed (simple)
        shell: bash
        run: |
          # feed.xml → href만 추출 → /posts/만 필터 → (중복 제거/상위 N개 제한) → 저장
          curl -s https://anesin.co.kr/feed.xml \
          | grep -Eo 'href="https?://[^"]+"' \
          | sed -E 's/^href="//; s/"$//' \
          | grep '/posts/'
          > url_list.txt

          echo "Prepared URLs from feed:"
          cat url_list.txt || true

      # ─────────────────────────────────────────────────────────────
      # ② (선택) 전파 대기 — 배포 직후 CDN 반영 시간 확보
      # ─────────────────────────────────────────────────────────────
      - name: Wait for Pages propagation
        if: hashFiles('url_list.txt') != ''
        run: sleep 20

      # ─────────────────────────────────────────────────────────────
      # ③ IndexNow 전송 (공식 포맷)
      #    - host: 도메인만 기입
      #    - key : 루트에 동일 키 파일(<KEY>.txt)도 존재하면 검증이 더 안정적
      # ─────────────────────────────────────────────────────────────
      - name: Notify IndexNow
        if: hashFiles('url_list.txt') != ''
        env:
          HOST: "anesin.co.kr"
          INDEXNOW_KEY: "848394252b544558bbaa73752b751847"
        shell: bash
        run: |
          {
            printf '{\n'
            printf '  "host": "%s",\n' "$HOST"
            printf '  "key": "%s",\n' "$INDEXNOW_KEY"
            printf '  "urlList": [\n'
            awk 'BEGIN{first=1} { if(!first) printf(",\n"); printf("    \"%s\"", $0); first=0 } END{printf("\n")} ' url_list.txt
            printf '  ]\n'
            printf '}\n'
          } > payload.json

          echo "Submitting IndexNow payload:"
          cat payload.json

          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @payload.json