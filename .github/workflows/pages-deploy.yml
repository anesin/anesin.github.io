name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow (no temp file)
        shell: bash
        env:
          HOST: "anesin.co.kr"
          INDEXNOW_KEY: "848394252b544558bbaa73752b751847"
        run: |
          # ① feed.xml 가져오기
          FEED_URL="https://anesin.co.kr/feed.xml"
          echo "Fetching feed: $FEED_URL"
          FEED=$(curl -fsSL "$FEED_URL" || true)

          if [ -z "$FEED" ]; then
            echo "⚠️  feed.xml not available — skipping IndexNow."
            exit 0
          fi

          # ② href 속성에서 /posts/ 포함된 링크만 추출
          URLS=$(printf "%s" "$FEED" \
            | grep -Eo 'href="https?://[^"]+"' \
            | sed -E 's/^href="//; s/"$//' \
            | grep '/posts/')

          if [ -z "$URLS" ]; then
            echo "⚠️  No post URLs found — skipping IndexNow."
            exit 0
          fi

          echo "Prepared URLs:"
          echo "$URLS"

          # ③ JSON 생성 (메모리 상에서 바로 payload 구성)
          PAYLOAD=$(jq -n \
            --arg host "$HOST" \
            --arg key "$INDEXNOW_KEY" \
            --argjson urls "$(printf '%s\n' "$URLS" | jq -R . | jq -s .)" \
            '{host: $host, key: $key, urlList: $urls}')

          echo "Submitting IndexNow payload:"
          echo "$PAYLOAD"

          # ④ IndexNow API 호출
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$PAYLOAD"