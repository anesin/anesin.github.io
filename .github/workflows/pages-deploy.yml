name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 리포지토리 체크아웃 (변경 파일 목록 보려면 필요)
      - name: Checkout (for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 변경된 포스트만 감지 → URL 리스트 생성
      - name: Build changed post URL list
        id: urls
        shell: bash
        env:
          BASE: "https://anesin.co.kr"              # ← 직접 입력
        run: |
          # 1) 직전 커밋과 비교해 바뀐 포스트만 추출
          git diff --name-only HEAD^ HEAD -- '_posts/*.md' > changed.txt || true

          # 2) 파일명 → 퍼마링크(가정: /posts/<slug>/)
          > url_list.txt
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            slug="${base#????-??-??-}"     # YYYY-MM-DD- 제거
            slug="${slug%.md}"
            echo "${BASE}/posts/${slug}/" >> url_list.txt
          done < changed.txt

          # 변경이 없으면 홈/사이트맵만 제출
          if [ ! -s url_list.txt ]; then
            echo "${BASE}/" > url_list.txt
            echo "${BASE}/sitemap.xml" >> url_list.txt
          fi

          echo "Prepared URLs:" && cat url_list.txt

      # 배포 반영 여유 (간단·안전)
      - name: Wait for Pages propagation
        run: sleep 30

      # IndexNow 제출 (공식 포맷)
      - name: Notify IndexNow
        env:
          HOST: "anesin.co.kr"                        # ← 직접 입력 (host는 도메인만)
          INDEXNOW_KEY: "848394252b544558bbaa73752b751847"
        run: |
          {
            printf '{\n'
            printf '  "host": "%s",\n' "$HOST"
            printf '  "key": "%s",\n' "$INDEXNOW_KEY"
            printf '  "urlList": [\n'
            awk 'BEGIN{first=1} { if(!first) printf(",\n"); printf("    \"%s\"", $0); first=0 } END{printf("\n")} ' url_list.txt
            printf '  ]\n'
            printf '}\n'
          } > payload.json

          echo "Submitting IndexNow payload:"
          cat payload.json

          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @payload.json