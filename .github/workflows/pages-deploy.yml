name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 배포본의 feed.xml(Atom)에서 <entry><link rel="alternate" ... href="..."> 만 추출
      - name: Build URL list from deployed Atom feed
        id: urls_from_feed
        shell: bash
        env:
          BASE: "https://anesin.co.kr"   # 사이트 루트 (직접 입력)
        run: |
          # 1) 배포본 feed.xml 가져오기
          curl -sS "${BASE}/feed.xml" > feed.xml

          # 2) Atom 포맷: <entry><link rel="alternate" type="text/html" href="..."/>
          #    → entry 내부의 rel="alternate" href만 뽑기
          grep -oP '(?i)(?<=<entry>).*?(?=</entry>)' feed.xml \
            | grep -ioP '<link[^>]*rel="alternate"[^>]*href="https?://[^"]+"' \
            | grep -ioP 'https?://[^"]+' \
            > url_list.txt

          # (선택) posts 이하만 필터링
          grep '/posts/' url_list.txt > url_list_posts.txt || true
          if [ -s url_list_posts.txt ]; then
            mv url_list_posts.txt url_list.txt
          fi

          # (선택) 최근 N개만 전송하고 싶다면 head -n 5 등으로 제한
          # head -n 5 url_list.txt > tmp && mv tmp url_list.txt

          echo "Prepared URLs from feed:" && cat url_list.txt

      # 전파 대기 (간단·안전)
      - name: Wait for Pages propagation
        run: sleep 3

      # IndexNow 전송 (공식 포맷)
      - name: Notify IndexNow
        if: hashFiles('url_list.txt') != ''          # 목록이 있을 때만 전송
        env:
          HOST: "anesin.co.kr"                       # host = 도메인만
          INDEXNOW_KEY: "848394252b544558bbaa73752b751847"
        run: |
          {
            printf '{\n'
            printf '  "host": "%s",\n' "$HOST"
            printf '  "key": "%s",\n' "$INDEXNOW_KEY"
            printf '  "urlList": [\n'
            awk 'BEGIN{first=1} { if(!first) printf(",\n"); printf("    \"%s\"", $0); first=0 } END{printf("\n")} ' url_list.txt
            printf '  ]\n'
            printf '}\n'
          } > payload.json

          echo "Submitting IndexNow payload:"
          cat payload.json

          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @payload.json