name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ─────────────────────────────────────────────────────────────
      # ① 배포본 feed.xml(Atom)에서 실제 포스트 URL 추출 → url_list.txt 생성
      #    - 먼저 GitHub Pages가 반환하는 page_url 사용
      #    - 실패 시 커스텀 도메인(anesin.co.kr)로 재시도
      # ─────────────────────────────────────────────────────────────
      - name: Build URL list from deployed Atom feed
        id: urls_from_feed
        shell: bash
        env:
          PRIMARY_BASE: "https://anesin.github.io"                 # 권장: GitHub 기본 도메인
          FALLBACK_BASE: ${{ steps.deployment.outputs.page_url }}  # 배포 출력 URL
        run: |
          set -u

          FEED_OK=0
          for BASE in "$FALLBACK_BASE" "$PRIMARY_BASE"; do
            [ -z "${BASE:-}" ] && continue
            FEED_URL="${BASE%/}/feed.xml"
            echo "Trying feed: $FEED_URL"
            HTTP=$(curl -w "%{http_code}" -sS --retry 5 --retry-delay 3 -o feed.xml "$FEED_URL" || echo "000")
            echo "HTTP=$HTTP"
            if [ "$HTTP" = "200" ] && [ -s feed.xml ]; then
              echo "Feed downloaded from $FEED_URL"
              FEED_OK=1
              break
            fi
            rm -f feed.xml || true
          done

          if [ "$FEED_OK" -ne 1 ]; then
            echo "No feed.xml available yet; skipping IndexNow."
            : > url_list.txt
            exit 0
          fi

          # <entry> 블록 안에서 rel과 무관하게 모든 <link ... href="..."> 추출
          # → href 값만 뽑고 /posts/ 만 남김 → 중복 제거 → 상위 10개
          : > url_list.txt
          grep -oP '(?is)(?<=<entry>).*?(?=</entry>)' feed.xml           || true \
            | grep -ioP '<link[^>]*\bhref="https?://[^"]+"'              || true \
            | grep -ioP 'https?://[^"]+'                                 || true \
            | grep '/posts/'                                             || true \
            | sort -u                                                    || true \
            | head -n 10                                                 >> url_list.txt

          echo "Prepared URLs from feed:"
          cat url_list.txt || true

      # ─────────────────────────────────────────────────────────────
      # ② (선택) 전파 대기: GitHub Pages가 전 세계 PoP에 반영될 시간 확보
      # ─────────────────────────────────────────────────────────────
      - name: Wait for Pages propagation
        if: hashFiles('url_list.txt') != ''
        run: sleep 20

      # ─────────────────────────────────────────────────────────────
      # ③ IndexNow 요청 (공식 포맷) — 실제 공개 URL만 전송
      #    host: 도메인만, key: 루트에 동일한 키 파일(<KEY>.txt)도 존재해야 안정
      # ─────────────────────────────────────────────────────────────
      - name: Notify IndexNow
        if: hashFiles('url_list.txt') != ''
        env:
          HOST: "anesin.co.kr"
          INDEXNOW_KEY: "848394252b544558bbaa73752b751847"
        run: |
          {
            printf '{\n'
            printf '  "host": "%s",\n' "$HOST"
            printf '  "key": "%s",\n' "$INDEXNOW_KEY"
            printf '  "urlList": [\n'
            awk 'BEGIN{first=1} { if(!first) printf(",\n"); printf("    \"%s\"", $0); first=0 } END{printf("\n")} ' url_list.txt
            printf '  ]\n'
            printf '}\n'
          } > payload.json

          echo "Submitting IndexNow payload:"
          cat payload.json

          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @payload.json